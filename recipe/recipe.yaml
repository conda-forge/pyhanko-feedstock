schema_version: 1

context:
  version: "0.38.1"

package:
  name: pyhanko
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/pyhanko/pyhanko-${{ version }}.tar.gz
  sha256: 27348b2bb5c6756402102a930b3404a1ccce4d1102f81e56399df268dd90f70d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=80.8.0
  run:
    - python >=${{ python_min }}
    - asn1crypto >=1.5.1
    - tzlocal >=4.3
    - pyhanko-certvalidator >=0.33.0,<0.34
    - aiohttp <3.15,>=3.9
    - cryptography >=48.0.0
    - lxml >=5.4.0

tests:
  - python:
      imports:
        - pyhanko
        - pyhanko.pdf_utils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: Tools for stamping and signing PDF files
  license: MIT
  license_file:
    - LICENSE
    - src/pyhanko/pdf_utils/LICENSE.PyPDF2
  homepage: https://github.com/MatthiasValvekens/pyHanko

extra:
  recipe-maintainers:
    - mrakitin
    - killua156
